# Local stand-in for the Upstash Redis this app uses in production.
#
# `@upstash/redis` talks HTTP, not the Redis wire protocol, so a bare
# `redis-server` is not enough on its own - `serverless-redis-http` (SRH)
# fronts it with the same REST API Upstash exposes. That keeps local dev on
# the exact client and code path that runs on Vercel.
#
#   docker compose up -d      # start
#   docker compose down       # stop (add -v to wipe stored sessions)
services:
  redis:
    image: redis:7-alpine
    # Not published to the host: only SRH needs to reach it.
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-http:
    image: hiett/serverless-redis-http:latest
    ports:
      - "8079:80"
    environment:
      SRH_MODE: env
      # Local-only shared secret; must match UPSTASH_REDIS_REST_TOKEN in
      # .env.local. Not a credential for anything outside this machine.
      SRH_TOKEN: local_dev_token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
